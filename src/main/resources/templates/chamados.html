<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Chamados</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>
        <div class="container mt-4" th:fragment="content">
            <h2 class="mb-4">Lista de Chamados</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Descricao</th>
                        <th>Status</th>
                        <th>Tipo</th>
                        <th>Tecnico</th>
                        <th>Usuário</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                <th:block th:each="chamado : ${chamados}">
                    <tr>
                        <td th:text="${chamado?.descricao}"></td>
                        <td th:text="${chamado?.status}"></td>
                        <td th:text="${chamado?.tipo}"></td>
                        <td th:text="${chamado?.tecnico}"></td>
                        <td th:text="${chamado?.usuario}"></td>
                        <td>
                            <a th:if="${perfis.contains('ADMIN')}" th:href="@{'/chamados/' + ${chamado.id} + '/detalhes'}"
                               class="btn btn-info btn-sm"><i class="bi bi-clock-history"></i> Detalhes</a>
                            <th:block th:if="${perfis.contains('TECNICO')}">
                                <button th:if="${chamado.status == 'ABERTO'}" class="btn btn-success btn-sm"
                                        data-bs-toggle="modal" data-bs-target="#resolverModal"
                                        th:attr="data-id=${chamado.id}, data-titulo=${chamado.titulo}"
                                        onclick="prepararResolucao(this)">
                                    <i class="bi bi-check2-circle"></i> Resolver
                                </button>
                                <span th:unless="${chamado.status == 'ABERTO'}" class="text-muted">—</span>
                            </th:block>
                            <th:block th:unless="${perfis.contains('TECNICO')}">
                                <a th:href="@{'/chamados/novo/'}" class="btn btn-primary btn-sm">Novo</a>
                                <a th:href="@{'/chamados/atualizar/' + ${chamado.id}}" class="btn btn-warning btn-sm">Editar</a>
                                <a th:href="@{'/chamados/cancelar/' + ${chamado.id}}" class="btn btn-danger btn-sm">Cancelar</a>
                            </th:block>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>

            <!-- Modal Resolver Chamado (apenas técnicos) -->
            <div class="modal fade" id="resolverModal" tabindex="-1" th:if="${perfis.contains('TECNICO')}">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Resolver chamado</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <p class="fw-semibold mb-3" id="resolverTitulo"></p>
                            <input type="hidden" id="resolverId">
                            <label for="resolverSolucao" class="form-label">Motivo da resolução <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="resolverSolucao" rows="4" maxlength="2000" required></textarea>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-success" onclick="resolverChamado()">Confirmar resolução</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function prepararResolucao(botao) {
                document.getElementById('resolverId').value = botao.dataset.id;
                document.getElementById('resolverTitulo').textContent = botao.dataset.titulo || '';
                document.getElementById('resolverSolucao').value = '';
            }

            function resolverChamado() {
                const id = document.getElementById('resolverId').value;
                const motivo = document.getElementById('resolverSolucao').value.trim();
                if (!motivo) {
                    alert('Informe o motivo da resolução.');
                    return;
                }
                fetch(`/api/chamados/${id}/resolver`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ motivo: motivo })
                }).then(r => {
                    if (r.ok) {
                        location.reload();
                    } else {
                        r.json().then(p => alert(p.detail || 'Erro ao resolver chamado'))
                            .catch(() => alert('Erro ao resolver chamado'));
                    }
                });
            }
        </script>
    </body>
</html>
