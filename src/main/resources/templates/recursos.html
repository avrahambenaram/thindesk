<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recursos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main class="container-fluid mt-4">
            <div class="row mb-4">
                <div class="col-md-8">
                    <h1><i class="bi bi-screwdriver"></i> Recursos</h1>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#novoRecursoModal">
                        <i class="bi bi-plus-circle"></i> Novo Recurso
                    </button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Tipo</th>
                                <th>Disponibilidade</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="recurso : ${recursos}">
                                <td th:text="${recurso.nome}">-</td>
                                <td th:text="${recurso.descricao}">-</td>
                                <td th:text="${recurso.tipo}">-</td>
                                <td>
                                    <span th:if="${recurso.disponivel}" class="badge bg-success">Disponível</span>
                                    <span th:unless="${recurso.disponivel}" class="badge bg-danger">Indisponível</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-warning"
                                            data-bs-toggle="modal" data-bs-target="#editarRecursoModal"
                                            th:attr="data-id=${recurso.id}, data-nome=${recurso.nome}, data-descricao=${recurso.descricao}, data-tipo=${recurso.tipo}, data-disponivel=${recurso.disponivel}"
                                            onclick="preencherEdicaoRecurso(this)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" th:onclick="deletarRecurso([[${recurso.id}]])">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recursos)}">
                                <td colspan="5" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox"></i> Nenhum recurso cadastrado
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Novo Recurso -->
            <div class="modal fade" id="novoRecursoModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Novo Recurso</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form>
                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome">
                                </div>
                                <div class="mb-3">
                                    <label for="descricao" class="form-label">Descrição</label>
                                    <textarea class="form-control" id="descricao"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="tipo" class="form-label">Tipo</label>
                                    <input type="text" class="form-control" id="tipo">
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" onclick="salvarRecurso()">Salvar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Modal Editar Recurso -->
            <div class="modal fade" id="editarRecursoModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Editar Recurso</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="editRecursoId">
                            <input type="hidden" id="editRecursoDisponivel">
                            <div class="mb-3">
                                <label for="editRecursoNome" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="editRecursoNome">
                            </div>
                            <div class="mb-3">
                                <label for="editRecursoDescricao" class="form-label">Descrição</label>
                                <textarea class="form-control" id="editRecursoDescricao"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="editRecursoTipo" class="form-label">Tipo</label>
                                <input type="text" class="form-control" id="editRecursoTipo">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-warning" onclick="salvarEdicaoRecurso()">Salvar alterações</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function salvarRecurso() {
                const recurso = {
                    nome: document.getElementById('nome').value,
                    descricao: document.getElementById('descricao').value,
                    tipo: document.getElementById('tipo').value
                };

                fetch('/api/recursos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recurso)
                }).then(r => {
                    if (r.ok) {
                        alert('Recurso salvo com sucesso!');
                        location.reload();
                    } else {
                        alert('Erro ao salvar');
                    }
                });
            }

            function preencherEdicaoRecurso(botao) {
                const d = botao.dataset;
                document.getElementById('editRecursoId').value = d.id || '';
                document.getElementById('editRecursoDisponivel').value = d.disponivel || 'true';
                document.getElementById('editRecursoNome').value = d.nome || '';
                document.getElementById('editRecursoDescricao').value = d.descricao || '';
                document.getElementById('editRecursoTipo').value = d.tipo || '';
            }

            function salvarEdicaoRecurso() {
                const id = document.getElementById('editRecursoId').value;
                const recurso = {
                    id: id,
                    nome: document.getElementById('editRecursoNome').value,
                    descricao: document.getElementById('editRecursoDescricao').value,
                    tipo: document.getElementById('editRecursoTipo').value,
                    disponivel: document.getElementById('editRecursoDisponivel').value === 'true'
                };

                fetch(`/api/recursos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recurso)
                }).then(r => {
                    if (r.ok) {
                        location.reload();
                    } else {
                        alert('Erro ao editar recurso');
                    }
                });
            }

            function deletarRecurso(id) {
                if (confirm('Tem certeza?')) {
                    fetch(`/api/recursos/${id}`, { method: 'DELETE' })
                        .then(r => r.ok ? location.reload() : alert('Erro ao deletar'));
                }
            }
        </script>
    </body>
</html>
