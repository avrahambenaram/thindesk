<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Chamado</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main class="container-fluid mt-4">
            <div class="row mb-4">
                <div class="col-12">
                    <h1><i class="bi bi-pencil-square"></i> Editar Chamado</h1>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <form th:action="@{'/chamados/atualizar/' + ${chamado.id}}" method="post">
                                <div class="mb-3">
                                    <label for="tipoId" class="form-label">Tipo de chamado</label>
                                    <select class="form-select" id="tipoId" name="tipoId" required>
                                        <option th:each="tipo : ${tipos}"
                                                th:value="${tipo.id}"
                                                th:text="${tipo.descricao}"
                                                th:selected="${tipo.id == chamado.tipoId}">Tipo</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="titulo" class="form-label">Título</label>
                                    <input type="text" class="form-control" id="titulo" name="titulo"
                                           maxlength="120" th:value="${chamado.titulo}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="descricao" class="form-label">Descrição</label>
                                    <textarea class="form-control" id="descricao" name="descricao" rows="5"
                                              maxlength="2000" th:text="${chamado.descricao}" required></textarea>
                                </div>
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/chamados}" class="btn btn-secondary">Voltar</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save"></i> Salvar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
