<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes de Horários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
    <div class="toggle-btn btn btn-dark d-md-none">
        <span>&#9776;</span>
    </div>

    <!-- Sidebar incluído como fragmento -->
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <main class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1><i class="bi bi-alarm"></i> Ajustes de Horários de Atendimento</h1>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Novo Horário</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/ajustes-horarios/salvar}" method="post">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="setor" class="form-label">Setor</label>
                            <input type="text" id="setor" name="setor" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label for="diaSemana" class="form-label">Dia</label>
                            <input type="text" id="diaSemana" name="diaSemana" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label for="horarioInicio" class="form-label">Início</label>
                            <input type="time" id="horarioInicio" name="horarioInicio" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label for="horarioFim" class="form-label">Fim</label>
                            <input type="time" id="horarioFim" name="horarioFim" class="form-control" required>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-check-circle"></i> Salvar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="bi bi-list"></i> Horários Cadastrados</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Setor</th>
                            <th>Dia</th>
                            <th>Início</th>
                            <th>Fim</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="horario : ${ajustesHorarios}">
                            <td th:text="${horario?.setor}">-</td>
                            <td th:text="${horario?.diaSemana}">-</td>
                            <td th:text="${horario?.horarioInicio}">-</td>
                            <td th:text="${horario?.horarioFim}">-</td>
                            <td>
                                <a th:href="@{/ajustes-horarios/deletar/{id}(id=${horario.id})}" class="btn btn-danger btn-sm">
                                    <i class="bi bi-trash"></i> Deletar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ajustesHorarios)}">
                            <td colspan="5" class="text-center text-muted py-4">
                                <i class="bi bi-inbox"></i> Nenhum horário cadastrado
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script th:src="@{/js/script.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
