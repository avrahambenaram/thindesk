<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Técnicos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main class="container-fluid mt-4">
            <div class="row mb-4">
                <div class="col-md-8">
                    <h1><i class="bi bi-person"></i> Técnicos</h1>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#novoTecnicoModal">
                        <i class="bi bi-plus-circle"></i> Novo Técnico
                    </button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Telefone</th>
                                <th>Especialidade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tecnico : ${tecnicos}">
                                <td th:text="${tecnico.nome}">-</td>
                                <td th:text="${tecnico.email}">-</td>
                                <td th:text="${tecnico.telefone}">-</td>
                                <td th:text="${tecnico.especialidade}">-</td>
                                <td>
                                    <span th:if="${tecnico.ativo}" class="badge bg-success">Ativo</span>
                                    <span th:unless="${tecnico.ativo}" class="badge bg-danger">Inativo</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-warning"
                                            data-bs-toggle="modal" data-bs-target="#editarTecnicoModal"
                                            th:attr="data-id=${tecnico.id}, data-nome=${tecnico.nome}, data-email=${tecnico.email}, data-telefone=${tecnico.telefone}, data-especialidade=${tecnico.especialidade}, data-ativo=${tecnico.ativo}"
                                            onclick="preencherEdicaoTecnico(this)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" th:onclick="deletarTecnico([[${tecnico.id}]])">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(tecnicos)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox"></i> Nenhum técnico cadastrado
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Novo Técnico -->
            <div class="modal fade" id="novoTecnicoModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Novo Técnico</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form>
                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email">
                                </div>
                                <div class="mb-3">
                                    <label for="telefone" class="form-label">Telefone</label>
                                    <input type="text" class="form-control" id="telefone">
                                </div>
                                <div class="mb-3">
                                    <label for="especialidade" class="form-label">Especialidade</label>
                                    <input type="text" class="form-control" id="especialidade">
                                </div>
                                <hr>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Login</label>
                                    <input type="text" class="form-control" id="username" autocomplete="off">
                                </div>
                                <div class="mb-3">
                                    <label for="senha" class="form-label">Senha inicial</label>
                                    <input type="password" class="form-control" id="senha" autocomplete="new-password">
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" onclick="salvarTecnico()">Salvar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Modal Editar Técnico -->
            <div class="modal fade" id="editarTecnicoModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Editar Técnico</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="editId">
                            <input type="hidden" id="editAtivo">
                            <div class="mb-3">
                                <label for="editNome" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="editNome">
                            </div>
                            <div class="mb-3">
                                <label for="editEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="editEmail">
                            </div>
                            <div class="mb-3">
                                <label for="editTelefone" class="form-label">Telefone</label>
                                <input type="text" class="form-control" id="editTelefone">
                            </div>
                            <div class="mb-3">
                                <label for="editEspecialidade" class="form-label">Especialidade</label>
                                <input type="text" class="form-control" id="editEspecialidade">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-warning" onclick="salvarEdicaoTecnico()">Salvar alterações</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function salvarTecnico() {
                const tecnico = {
                    nome: document.getElementById('nome').value,
                    email: document.getElementById('email').value,
                    telefone: document.getElementById('telefone').value,
                    especialidade: document.getElementById('especialidade').value,
                    username: document.getElementById('username').value,
                    senha: document.getElementById('senha').value
                };

                fetch('/api/tecnicos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tecnico)
                }).then(r => {
                    if (r.ok) {
                        alert('Técnico salvo com sucesso!');
                        location.reload();
                    } else {
                        r.json().then(p => alert(p.detail || 'Erro ao salvar técnico'));
                    }
                });
            }

            function preencherEdicaoTecnico(botao) {
                const d = botao.dataset;
                document.getElementById('editId').value = d.id || '';
                document.getElementById('editAtivo').value = d.ativo || 'true';
                document.getElementById('editNome').value = d.nome || '';
                document.getElementById('editEmail').value = d.email || '';
                document.getElementById('editTelefone').value = d.telefone || '';
                document.getElementById('editEspecialidade').value = d.especialidade || '';
            }

            function salvarEdicaoTecnico() {
                const id = document.getElementById('editId').value;
                const tecnico = {
                    id: id,
                    nome: document.getElementById('editNome').value,
                    email: document.getElementById('editEmail').value,
                    telefone: document.getElementById('editTelefone').value,
                    especialidade: document.getElementById('editEspecialidade').value,
                    ativo: document.getElementById('editAtivo').value === 'true'
                };

                fetch(`/api/tecnicos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tecnico)
                }).then(r => {
                    if (r.ok) {
                        location.reload();
                    } else {
                        alert('Erro ao editar técnico');
                    }
                });
            }

            function deletarTecnico(id) {
                if (confirm('Tem certeza?')) {
                    fetch(`/api/tecnicos/${id}`, { method: 'DELETE' })
                        .then(r => r.ok ? location.reload() : alert('Erro ao deletar'));
                }
            }
        </script>
    </body>
</html>
