<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detalhes do Chamado</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main class="container-fluid mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1><i class="bi bi-headset"></i> Chamado</h1>
                <a th:href="@{/chamados}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-semibold" th:text="${chamado.titulo}">Título</span>
                    <div class="d-flex gap-2 align-items-center">
                        <span th:if="${chamado.status == 'Resolvido'}" class="badge bg-success" th:text="${chamado.status}">RESOLVIDO</span>
                        <span th:if="${chamado.status == 'Em Andamento'}" class="badge bg-info" th:text="${chamado.status}">EM ANDAMENTO</span>
                        <span th:if="${chamado.status == 'Aberto'}" class="badge bg-warning text-dark" th:text="${chamado.status}">ABERTO</span>
                        <span th:if="${chamado.status == 'Cancelado'}" class="badge bg-secondary" th:text="${chamado.status}">CANCELADO</span>
                    </div>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-3">Descrição</dt>
                        <dd class="col-sm-9" th:text="${chamado.descricao}">-</dd>
                        <dt class="col-sm-3">Tipo</dt>
                        <dd class="col-sm-9" th:text="${chamado.tipo}">-</dd>
                        <dt class="col-sm-3">Aberto por</dt>
                        <dd class="col-sm-9" th:text="${chamado.usuario}">-</dd>
                        <dt class="col-sm-3">Aberto em</dt>
                        <dd class="col-sm-9" th:text="${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')}">-</dd>
                        <th:block th:if="${chamado.tecnico != null}">
                            <dt class="col-sm-3">Técnico</dt>
                            <dd class="col-sm-9" th:text="${chamado.tecnico}">-</dd>
                        </th:block>
                        <th:block th:if="${chamado.status == 'Resolvido'}">
                            <dt class="col-sm-3">Resolvido em</dt>
                            <dd class="col-sm-9" th:text="${#temporals.format(chamado.dataResolucao, 'dd/MM/yyyy HH:mm')}">-</dd>
                            <dt class="col-sm-3">Motivo da resolução</dt>
                            <dd class="col-sm-9" th:text="${chamado.solucao}">-</dd>
                        </th:block>
                    </dl>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header"><i class="bi bi-clock-history"></i> Histórico</div>
                <div class="card-body">
                    <table class="table table-sm mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Data</th>
                                <th>Ação</th>
                                <th>Responsável</th>
                                <th>Detalhe</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="evento : ${chamado.historico}">
                                <td th:text="${#temporals.format(evento.data, 'dd/MM/yyyy HH:mm')}">-</td>
                                <td th:switch="${evento.acao}">
                                    <span th:case="'ABERTURA'">Abertura</span>
                                    <span th:case="'EM_ANDAMENTO'">Em Andamento</span>
                                    <span th:case="'RESOLUCAO'">Resolução</span>
                                    <span th:case="'EDICAO'">Edição</span>
                                    <span th:case="'CANCELAMENTO'">Cancelamento</span>
                                    <span th:default th:text="${evento.acao}"></span>
                                </td>
                                <td th:text="${evento.responsavel}">-</td>
                                <td th:text="${evento.motivo}">-</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(chamado.historico)}">
                                <td colspan="4" class="text-center text-muted">Sem registros</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Ações para técnico -->
            <div class="mb-4" th:if="${perfis.contains('TECNICO') and chamado.status != 'Resolvido'}">
                <div class="d-flex gap-2">
                    <button th:if="${chamado.status == 'Aberto'}" type="button" class="btn btn-primary" 
                            onclick="colocarEmAndamento()" data-chamado-id="${chamado.id}">
                        <i class="bi bi-play-circle"></i> Colocar em Andamento
                    </button>
                    <button type="button" class="btn btn-success" onclick="abrirModalResolver()" data-chamado-id="${chamado.id}">
                        <i class="bi bi-check-circle"></i> Resolver
                    </button>
                </div>
            </div>
        </main>

        <!-- Modal para resolver chamado -->
        <div class="modal fade" id="modalResolver" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Resolver Chamado</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="motivo" class="form-label">Motivo da Resolução <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="motivo" rows="4" placeholder="Descreva a solução..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-success" onclick="resolver()">
                            <i class="bi bi-check-circle"></i> Resolver
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const chamadoId = '[[ ${chamado.id} ]]';
            const modalResolver = new bootstrap.Modal(document.getElementById('modalResolver'));

            function colocarEmAndamento() {
                fetch(`/api/chamados/${chamadoId}/andamento`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao colocar em andamento');
                    alert('Chamado colocado em andamento!');
                    location.reload();
                })
                .catch(error => {
                    console.error('Erro:', error);
                    alert('Erro ao colocar em andamento: ' + error.message);
                });
            }

            function abrirModalResolver() {
                document.getElementById('motivo').value = '';
                modalResolver.show();
            }

            function resolver() {
                const motivo = document.getElementById('motivo').value.trim();
                if (!motivo) {
                    alert('Por favor, informe o motivo da resolução');
                    return;
                }

                fetch(`/api/chamados/${chamadoId}/resolver`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ motivo: motivo })
                })
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao resolver chamado');
                    alert('Chamado resolvido com sucesso!');
                    location.reload();
                })
                .catch(error => {
                    console.error('Erro:', error);
                    alert('Erro ao resolver: ' + error.message);
                });
            }
        </script>
    </body>
</html>
