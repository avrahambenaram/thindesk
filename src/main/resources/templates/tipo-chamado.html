<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tipo de Chamado</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main class="container-fluid mt-4">
            <div class="row mb-4">
                <div class="col-md-8">
                    <h1><i class="bi bi-megaphone"></i> Tipos de Chamado</h1>
                </div>
                <div class="col-md-4 text-end" th:if="${perfis.contains('ADMIN')}">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#novoTipoModal">
                        <i class="bi bi-plus-circle"></i> Novo Tipo
                    </button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tipo : ${tiposChamado}">
                                <td th:text="${tipo.descricao}">-</td>
                                <td th:text="${tipo.categoria}">-</td>
                                <td>
                                    <span th:if="${tipo.ativo}" class="badge bg-success">Ativo</span>
                                    <span th:unless="${tipo.ativo}" class="badge bg-danger">Inativo</span>
                                </td>
                                <td>
                                    <span th:unless="${perfis.contains('ADMIN')}" class="text-muted">—</span>
                                    <th:block th:if="${perfis.contains('ADMIN')}">
                                        <button class="btn btn-sm btn-warning"
                                                data-bs-toggle="modal" data-bs-target="#editarTipoModal"
                                                th:attr="data-id=${tipo.id}, data-descricao=${tipo.descricao}, data-categoria=${tipo.categoria}, data-ativo=${tipo.ativo}"
                                                onclick="preencherEdicaoTipo(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button class="btn btn-sm btn-danger" th:onclick="deletarTipo([[${tipo.id}]])">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </th:block>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(tiposChamado)}">
                                <td colspan="4" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox"></i> Nenhum tipo de chamado cadastrado
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <th:block th:if="${perfis.contains('ADMIN')}">
            <!-- Modal Novo Tipo -->
            <div class="modal fade" id="novoTipoModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Novo Tipo de Chamado</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form>
                                <div class="mb-3">
                                    <label for="descricao" class="form-label">Descrição</label>
                                    <input type="text" class="form-control" id="descricao">
                                </div>
                                <div class="mb-3">
                                    <label for="categoria" class="form-label">Categoria</label>
                                    <input type="text" class="form-control" id="categoria">
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" onclick="salvarTipoChamado()">Salvar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Modal Editar Tipo -->
            <div class="modal fade" id="editarTipoModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Editar Tipo de Chamado</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="editTipoId">
                            <input type="hidden" id="editTipoAtivo">
                            <div class="mb-3">
                                <label for="editTipoDescricao" class="form-label">Descrição</label>
                                <input type="text" class="form-control" id="editTipoDescricao">
                            </div>
                            <div class="mb-3">
                                <label for="editTipoCategoria" class="form-label">Categoria</label>
                                <input type="text" class="form-control" id="editTipoCategoria">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-warning" onclick="salvarEdicaoTipo()">Salvar alterações</button>
                        </div>
                    </div>
                </div>
            </div>
            </th:block>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function salvarTipoChamado() {
                const tipo = {
                    descricao: document.getElementById('descricao').value,
                    categoria: document.getElementById('categoria').value
                };

                fetch('/api/tipos-chamado', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tipo)
                }).then(r => {
                    if (r.ok) {
                        alert('Tipo de chamado salvo com sucesso!');
                        location.reload();
                    } else {
                        alert('Erro ao salvar');
                    }
                });
            }

            function preencherEdicaoTipo(botao) {
                const d = botao.dataset;
                document.getElementById('editTipoId').value = d.id || '';
                document.getElementById('editTipoAtivo').value = d.ativo || 'true';
                document.getElementById('editTipoDescricao').value = d.descricao || '';
                document.getElementById('editTipoCategoria').value = d.categoria || '';
            }

            function salvarEdicaoTipo() {
                const id = document.getElementById('editTipoId').value;
                const tipo = {
                    id: id,
                    descricao: document.getElementById('editTipoDescricao').value,
                    categoria: document.getElementById('editTipoCategoria').value,
                    ativo: document.getElementById('editTipoAtivo').value === 'true'
                };

                fetch(`/api/tipos-chamado/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tipo)
                }).then(r => {
                    if (r.ok) {
                        location.reload();
                    } else {
                        alert('Erro ao editar tipo de chamado');
                    }
                });
            }

            function deletarTipo(id) {
                if (confirm('Tem certeza?')) {
                    fetch(`/api/tipos-chamado/${id}`, { method: 'DELETE' })
                        .then(r => r.ok ? location.reload() : alert('Erro ao deletar'));
                }
            }
        </script>
    </body>
</html>
